services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Tiny receiver that prints signed webhooks; swap for your real consumer.
  webhook-sink:
    image: mendhak/http-https-echo:34
    environment:
      HTTP_PORT: 8081
    ports:
      - "8081:8081"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
      API_KEYS: "dev-key:local-dev"
      LOG_LEVEL: debug
      ENABLE_PPROF: "true"
      WEBHOOK_URL: http://webhook-sink:8081/events
      WEBHOOK_SECRET: change-me
      RATE_LIMIT_RPS: "50"
      RATE_LIMIT_BURST: "100"
    ports:
      - "8080:8080"

volumes:
  pgdata:
